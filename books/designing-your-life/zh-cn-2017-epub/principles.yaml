schema_version: "0.1"
package_id: designing-your-life-zh-cn-2017-full-book
principles:
  - id: identify-the-right-problem-first
    title: 先确认真正的问题，再投入解决
    statement: 在设计改变之前，先检验当前定义的问题是否只是表面症状、错误预设或他人的期待。
    extraction_type: explicit
    source_refs:
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 1
        section: 分析测评你目前的生活
        evidence_type: paraphrase
        evidence_summary: 作者强调发现问题与解决问题同等重要，并以长期解决错误问题的经历说明其代价。
        locator:
          format: epub
          spine_index: 6
          doc_path: OEBPS/Text/chapter4.xhtml
          block_start: 4
          block_end: 5
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 1
        section: 分析测评你目前的生活
        evidence_type: paraphrase
        evidence_summary: 章节案例总结指出，人可能在错误问题上投入多年，甚至得到并不幸福的成功。
        locator:
          format: epub
          spine_index: 6
          doc_path: OEBPS/Text/chapter4.xhtml
          block_start: 17
          block_end: 18
    applications:
      - 写下想解决的问题，并追问它对应的真实需要和可观察事实
      - 在投入重大成本前，用访谈或小实验检验问题定义
    boundaries:
      - 反复定义问题不能成为拖延行动的理由
      - 紧急安全或健康风险应先处理，不应等待完整探索
    confidence: high
    review_status: reviewing

  - id: reframe-gravity-problems
    title: 接受不可改变的约束，重构可行动的问题
    statement: 将无法由当前行动改变的现实视为设计边界，把注意力转向仍可影响的变量和路径。
    extraction_type: explicit
    source_refs:
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 1
        section: 辨识无法解决的“重力问题”
        evidence_type: paraphrase
        evidence_summary: 作者把不可解决的处境定义为现实条件，并主张先接受现实。
        locator:
          format: epub
          spine_index: 7
          doc_path: OEBPS/Text/chapter4-1.xhtml
          block_start: 16
          block_end: 18
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 1
        section: 重力问题
        evidence_type: paraphrase
        evidence_summary: 作者说明接受约束后可以重新构建可解决的问题，并从真实位置开始设计。
        locator:
          format: epub
          spine_index: 8
          doc_path: OEBPS/Text/chapter4-2.xhtml
          block_start: 10
          block_end: 11
    applications:
      - 将问题拆成不可控约束、可影响变量和下一步行动
      - 为相同目标寻找不依赖原有路径的替代方案
    boundaries:
      - 不要把高风险、耗时或需要集体行动的问题误判为绝对不可改变
      - 接受现实不等于认可不公或停止长期改变环境
    confidence: high
    review_status: reviewing

  - id: assess-health-work-play-love
    title: 用健康、工作、娱乐和爱建立生活基线
    statement: 分别盘点健康、工作、娱乐和爱，形成对当前生活状态的多维描述，再选择需要设计的领域。
    extraction_type: explicit
    source_refs:
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 1
        section: 人生设计评估
        evidence_type: paraphrase
        evidence_summary: 作者定义四个评估领域，并建议先评估现实情况再选择要设计的领域。
        locator:
          format: epub
          spine_index: 9
          doc_path: OEBPS/Text/chapter4-3.xhtml
          block_start: 2
          block_end: 8
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 1
        section: “健康/工作/娱乐/爱”仪表盘
        evidence_type: paraphrase
        evidence_summary: 仪表盘被用来了解四个领域的当前状态和注意点。
        locator:
          format: epub
          spine_index: 10
          doc_path: OEBPS/Text/chapter4-4.xhtml
          block_start: 2
          block_end: 5
    applications:
      - 为四个领域各写几句现状描述并给出主观刻度
      - 从明显不足或亮起警报的领域选择一个探索主题
    boundaries:
      - 四个领域没有适用于所有人生阶段的固定完美比例
      - 主观仪表盘不能代替医疗、心理或财务专业评估
    confidence: high
    review_status: reviewing

  - id: treat-balance-as-contextual
    title: 把生活平衡视为阶段性的配置
    statement: 健康、工作、娱乐和爱的相对投入会随人生阶段变化，评估的目的不是追求静态均分，而是识别当前是否可接受。
    extraction_type: inferred
    source_refs:
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 1
        section: “健康/工作/娱乐/爱”仪表盘
        evidence_type: synthesis
        evidence_summary: 作者否定统一的完美平衡，并通过不同人生情境说明领域配置会变化。
        locator:
          format: epub
          spine_index: 10
          doc_path: OEBPS/Text/chapter4-4.xhtml
          block_start: 5
          block_end: 11
    applications:
      - 评估当前失衡是否出于清醒选择、是否可持续以及何时复查
    boundaries:
      - 阶段性失衡不能用来合理化持续伤害健康或关系的安排
      - 这是对段落与案例的归纳，不是作者给出的固定判定公式
    confidence: medium
    review_status: reviewing

  - id: turn-dashboard-signals-into-experiments
    title: 把仪表盘信号转成一个可复查的小实验
    statement: 选择一个需要关注的领域，设计低成本行动并在约定时间重新评估，而不是一次性规划完整人生。
    extraction_type: adapted
    source_refs:
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 1
        section: 像设计师一样思考
        evidence_type: synthesis
        evidence_summary: 作者把人生设计描述为持续实验和原型迭代，并建议根据仪表盘识别需要改善之处和再次评估。
        locator:
          format: epub
          spine_index: 11
          doc_path: OEBPS/Text/chapter4-5.xhtml
          block_start: 2
          block_end: 7
    applications:
      - 选择一个红灯领域，定义一项一周内可执行的行动和复查日期
      - 复查后依据观察结果继续、调整或停止实验
    boundaries:
      - 一周和单一行动是本知识包的应用改写，不是原书规定的流程
      - 涉及严重健康、安全或法律问题时应寻求专业帮助
    confidence: medium
    review_status: reviewing

  - id: align-work-and-life-views
    title: 用工作观和人生观校准方向
    statement: 分别写下工作为何重要与人生何以有意义，再检查身份、信念和行动是否一致，并在转折期重新校准。
    extraction_type: explicit
    source_refs:
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 2
        section: 创建人生的指南针
        evidence_type: paraphrase
        evidence_summary: 作者把工作观和人生观视为人生指南针，并用身份、信念和行动的一致性判断方向。
        locator:
          format: epub
          spine_index: 12
          doc_path: OEBPS/Text/chapter5.xhtml
          block_start: 19
          block_end: 29
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 2
        section: 不要偏离正确的航线
        evidence_type: paraphrase
        evidence_summary: 作者建议在迷茫、重大转折或定期复盘时重新检查工作观和人生观。
        locator:
          format: epub
          spine_index: 15
          doc_path: OEBPS/Text/chapter5-3.xhtml
          block_start: 2
          block_end: 11
    applications:
      - 各用一页写下当前工作观和人生观，并标出互补、冲突和需要妥协之处
      - 在换工作、迁居或承担新角色前重新检查选择与两种观念的一致性
    boundaries:
      - 一致性不是要求所有角色毫无冲突，而是让必要妥协变得清楚且可复查
      - 工作观和人生观会变化，不应把一次书写当作永久答案
    confidence: high
    review_status: reviewing

  - id: track-engagement-and-energy
    title: 用投入与能量记录寻找可设计的线索
    statement: 持续记录具体活动带来的投入程度和能量变化，通过周期性反思发现值得增加、减少或重新安排的活动。
    extraction_type: explicit
    source_refs:
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 3
        section: 找到你的路
        evidence_type: paraphrase
        evidence_summary: 作者将投入和能量定义为寻路线索，并用美好时光日志记录活动中的具体状态。
        locator:
          format: epub
          spine_index: 17
          doc_path: OEBPS/Text/chapter6-1.xhtml
          block_start: 2
          block_end: 4
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 3
        section: 记录“美好时光日志”
        evidence_type: paraphrase
        evidence_summary: 日志由活动记录和反思组成，要求具体观察投入、能量及其变化趋势。
        locator:
          format: epub
          spine_index: 21
          doc_path: OEBPS/Text/chapter6-5.xhtml
          block_start: 2
          block_end: 8
    applications:
      - 连续两周记录关键活动、投入程度和活动前后的能量变化
      - 每周复盘一次，挑选一个可增加、减少或改变环境的活动进行调整
    boundaries:
      - 短期兴奋不等于长期适合，应结合价值观、责任和持续观察判断
      - 能量记录不是医学评估，持续疲惫或情绪异常需要专业支持
    confidence: high
    review_status: reviewing

  - id: generate-before-judging
    title: 先扩展选择，再延后评判
    statement: 在陷入困境时先生成大量甚至不现实的想法，避免过早依恋第一个方案，再从更丰富的选择中形成可测试方向。
    extraction_type: explicit
    source_refs:
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 4
        section: 打开思路，拒绝自我设限
        evidence_type: paraphrase
        evidence_summary: 作者主张以数量拓宽构思空间，把延迟评判和不选择第一个方案作为设计原则。
        locator:
          format: epub
          spine_index: 25
          doc_path: OEBPS/Text/chapter7-1.xhtml
          block_start: 9
          block_end: 17
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 4
        section: 制作你的思维导图
        evidence_type: paraphrase
        evidence_summary: 思维导图通过快速自由联想绕开自我审查，再把外围概念组合成新方向。
        locator:
          format: epub
          spine_index: 26
          doc_path: OEBPS/Text/chapter7-2.xhtml
          block_start: 2
          block_end: 14
    applications:
      - 为同一困境先写出至少十个方向，再开始筛选
      - 以投入、能量或心流体验为中心制作思维导图并组合外围概念
    boundaries:
      - 延后评判只适用于构思阶段，行动前仍需评估安全、伦理、成本和可行性
      - 想法数量不是目标本身，最终应转化为可验证的问题或原型
    confidence: high
    review_status: reviewing

  - id: create-three-odyssey-plans
    title: 同时设计三种可成立的五年人生
    statement: 为未来五年设计三个彼此不同且都值得认真考虑的版本，以问题、资源、喜爱、自信和一致性打开真实选择，而不是把后两个当作退路。
    extraction_type: explicit
    source_refs:
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 5
        section: 畅想人生的多种可能性
        evidence_type: paraphrase
        evidence_summary: 作者要求并行设计三个不同且都可能成立的五年计划，以避免过早锁定单一路径。
        locator:
          format: epub
          spine_index: 30
          doc_path: OEBPS/Text/chapter8-1.xhtml
          block_start: 2
          block_end: 12
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 5
        section: 奥德赛计划详解
        evidence_type: paraphrase
        evidence_summary: 每个计划包含时间线、标题、待探索问题，以及物力、喜爱、自信和一致性评估。
        locator:
          format: epub
          spine_index: 31
          doc_path: OEBPS/Text/chapter8-2.xhtml
          block_start: 2
          block_end: 18
    applications:
      - 分别设计当前方向延展、当前方向消失后的选择、不考虑金钱和形象时的选择
      - 为每个版本列出两到三个未知问题，作为后续原型的研究目标
    boundaries:
      - 五年计划是探索草图，不是对未来的承诺或精确预测
      - 三个版本应真正不同，但都必须尊重现实责任和不可逾越的约束
    confidence: high
    review_status: reviewing

  - id: prototype-before-committing
    title: 在重大投入前用真实体验获取数据
    statement: 对感兴趣的未来先提出具体问题，再通过低成本对话或体验接触真实世界，快速获得反馈后才扩大投入。
    extraction_type: explicit
    source_refs:
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 6
        section: 学会提问
        evidence_type: paraphrase
        evidence_summary: 作者把原型定义为围绕问题创造真实体验、快速获得反馈并逐步接近未来的方法。
        locator:
          format: epub
          spine_index: 35
          doc_path: OEBPS/Text/chapter9-1.xhtml
          block_start: 4
          block_end: 9
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 6
        section: 原型体验
        evidence_type: paraphrase
        evidence_summary: 作者建议用观摩、短项目、志愿活动或实习等体验检验自己是否喜欢真实工作内容。
        locator:
          format: epub
          spine_index: 37
          doc_path: OEBPS/Text/chapter9-3.xhtml
          block_start: 1
          block_end: 2
    applications:
      - 在转行、长期学习或创业前先安排一次从业者对话和一次短期真实体验
      - 为原型写下要回答的问题、投入上限和结束后的复盘标准
    boundaries:
      - 原型用于学习而不是证明既定答案，不应只选择会支持原想法的体验
      - 医疗、法律、安全等高风险领域的体验必须遵守专业资质和监管要求
    confidence: high
    review_status: reviewing

  - id: understand-the-hiring-system
    title: 按招聘系统的真实需求设计求职表达
    statement: 先理解职位描述、筛选机制和招聘方风险，再如实突出与岗位需求匹配的证据，而不是只围绕自己的愿望陈述。
    extraction_type: adapted
    source_refs:
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 7
        section: 找工作的首要原则是“适合”
        evidence_type: paraphrase
        evidence_summary: 作者说明简历筛选依赖岗位关键词和需求匹配，并建议集中呈现与职位有关的能力。
        locator:
          format: epub
          spine_index: 41
          doc_path: OEBPS/Text/chapter10-2.xhtml
          block_start: 1
          block_end: 10
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 7
        section: 让工作更完美
        evidence_type: synthesis
        evidence_summary: 作者用招聘方视角重构求职，强调理解其流程与寻找合适人选的需求。
        locator:
          format: epub
          spine_index: 45
          doc_path: OEBPS/Text/chapter10-6.xhtml
          block_start: 8
          block_end: 12
    applications:
      - 为目标岗位标出核心需求，并为每项需求准备一条真实经历证据
      - 面试前研究招聘阶段、决策角色和对方最需要降低的风险
    boundaries:
      - 匹配表达不等于复制关键词造假，缺少的资历和技能必须如实说明
      - 本原则是对特定招聘环境的应用改写，不保证适用于所有国家、行业或组织
    confidence: medium
    review_status: reviewing

  - id: explore-opportunities-through-conversations
    title: 用求知对话进入机会网络
    statement: 把关系网重构为向业内人士问路，通过真诚了解经历和领域来发现机会，而不是一开始就索取职位。
    extraction_type: explicit
    source_refs:
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 8
        section: 好工作是设计出来的
        evidence_type: paraphrase
        evidence_summary: 作者用人生设计采访说明，先了解故事和行业，再在恰当时机从探索转向机会讨论。
        locator:
          format: epub
          spine_index: 46
          doc_path: OEBPS/Text/chapter11.xhtml
          block_start: 2
          block_end: 14
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 8
        section: 发挥人际网的作用
        evidence_type: paraphrase
        evidence_summary: 作者把关系网重新定义为向领域内的人咨询方向、倾听经历并逐步加入交流网络。
        locator:
          format: epub
          spine_index: 47
          doc_path: OEBPS/Text/chapter11-1.xhtml
          block_start: 3
          block_end: 10
    applications:
      - 约谈一个目标领域从业者，重点询问其经历、日常工作和进入路径
      - 每次谈话结束时请求下一位值得了解的人或下一种可体验的场景
    boundaries:
      - 对话应尊重对方时间和隐私，不应伪装求知以操纵对方提供职位
      - 网络规模不能替代能力、诚信和对实际工作的验证
    confidence: high
    review_status: reviewing

  - id: choose-then-move-forward
    title: 做出选择后主动放下未选路径
    statement: 先生成并缩小选项，再综合信息和自身体验做出选择；决定之后把注意力转向如何走好已选路径，而不是反复比较未选方案。
    extraction_type: explicit
    source_refs:
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 9
        section: 选择四步骤
        evidence_type: paraphrase
        evidence_summary: 作者把选择分为生成、筛选、决定和放下四步，反对在选择后长期反刍。
        locator:
          format: epub
          spine_index: 50
          doc_path: OEBPS/Text/chapter12-1.xhtml
          block_start: 1
          block_end: 10
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 9
        section: 避免过度思虑，学会放手
        evidence_type: paraphrase
        evidence_summary: 作者说明放手不是强迫自己遗忘其他选择，而是专注于推进已经选择的方向。
        locator:
          format: epub
          spine_index: 51
          doc_path: OEBPS/Text/chapter12-2.xhtml
          block_start: 8
          block_end: 16
    applications:
      - 为重要选择设定信息截止时间和决策日期，决定后写下下一步行动
      - 当再次反刍未选路径时，把问题改写为如何改进当前选择
    boundaries:
      - 放下不等于拒绝新证据；出现重大风险或前提变化时可以重新选择
      - 选择过程不能替代需要专业评估或利益相关者同意的决策程序
    confidence: high
    review_status: reviewing

  - id: reframe-failures-for-learning
    title: 区分失败类型，只提炼可行动的学习
    statement: 记录失败并区分偶发错误、长期弱点和成长机会，把精力放在能够识别原因并改变下一次行动的失败上。
    extraction_type: explicit
    source_refs:
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 10
