principles:
  - id: identify-the-right-problem-first
    title: 先确认真正的问题，再投入解决
    statement: 在设计改变之前，先检验当前定义的问题是否只是表面症状、错误预设或他人的期待。
    extraction_type: explicit
    source_refs:
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 1
        section: 分析测评你目前的生活
        evidence_type: paraphrase
        evidence_summary: 作者强调发现问题与解决问题同等重要，并以长期解决错误问题的经历说明其代价。
        locator:
          format: epub
          spine_index: 6
          doc_path: OEBPS/Text/chapter4.xhtml
          block_start: 4
          block_end: 5
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 1
        section: 分析测评你目前的生活
        evidence_type: paraphrase
        evidence_summary: 章节案例总结指出，人可能在错误问题上投入多年，甚至得到并不幸福的成功。
        locator:
          format: epub
          spine_index: 6
          doc_path: OEBPS/Text/chapter4.xhtml
          block_start: 17
          block_end: 18
    applications:
      - 写下想解决的问题，并追问它对应的真实需要和可观察事实
      - 在投入重大成本前，用访谈或小实验检验问题定义
    boundaries:
      - 反复定义问题不能成为拖延行动的理由
      - 紧急安全或健康风险应先处理，不应等待完整探索
    confidence: high
    review_status: reviewing

  - id: reframe-gravity-problems
    title: 接受不可改变的约束，重构可行动的问题
    statement: 将无法由当前行动改变的现实视为设计边界，把注意力转向仍可影响的变量和路径。
    extraction_type: explicit
    source_refs:
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 1
        section: 辨识无法解决的“重力问题”
        evidence_type: paraphrase
        evidence_summary: 作者把不可解决的处境定义为现实条件，并主张先接受现实。
        locator:
          format: epub
          spine_index: 7
          doc_path: OEBPS/Text/chapter4-1.xhtml
          block_start: 16
          block_end: 18
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 1
        section: 重力问题
        evidence_type: paraphrase
        evidence_summary: 作者说明接受约束后可以重新构建可解决的问题，并从真实位置开始设计。
        locator:
          format: epub
          spine_index: 8
          doc_path: OEBPS/Text/chapter4-2.xhtml
          block_start: 10
          block_end: 11
    applications:
      - 将问题拆成不可控约束、可影响变量和下一步行动
      - 为相同目标寻找不依赖原有路径的替代方案
    boundaries:
      - 不要把高风险、耗时或需要集体行动的问题误判为绝对不可改变
      - 接受现实不等于认可不公或停止长期改变环境
    confidence: high
    review_status: reviewing

  - id: assess-health-work-play-love
    title: 用健康、工作、娱乐和爱建立生活基线
    statement: 分别盘点健康、工作、娱乐和爱，形成对当前生活状态的多维描述，再选择需要设计的领域。
    extraction_type: explicit
    source_refs:
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 1
        section: 人生设计评估
        evidence_type: paraphrase
        evidence_summary: 作者定义四个评估领域，并建议先评估现实情况再选择要设计的领域。
        locator:
          format: epub
          spine_index: 9
          doc_path: OEBPS/Text/chapter4-3.xhtml
          block_start: 2
          block_end: 8
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 1
        section: “健康/工作/娱乐/爱”仪表盘
        evidence_type: paraphrase
        evidence_summary: 仪表盘被用来了解四个领域的当前状态和注意点。
        locator:
          format: epub
          spine_index: 10
          doc_path: OEBPS/Text/chapter4-4.xhtml
          block_start: 2
          block_end: 5
    applications:
      - 为四个领域各写几句现状描述并给出主观刻度
      - 从明显不足或亮起警报的领域选择一个探索主题
    boundaries:
      - 四个领域没有适用于所有人生阶段的固定完美比例
      - 主观仪表盘不能代替医疗、心理或财务专业评估
    confidence: high
    review_status: reviewing

  - id: treat-balance-as-contextual
    title: 把生活平衡视为阶段性的配置
    statement: 健康、工作、娱乐和爱的相对投入会随人生阶段变化，评估的目的不是追求静态均分，而是识别当前是否可接受。
    extraction_type: inferred
    source_refs:
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 1
        section: “健康/工作/娱乐/爱”仪表盘
        evidence_type: synthesis
        evidence_summary: 作者否定统一的完美平衡，并通过不同人生情境说明领域配置会变化。
        locator:
          format: epub
          spine_index: 10
          doc_path: OEBPS/Text/chapter4-4.xhtml
          block_start: 5
          block_end: 11
    applications:
      - 评估当前失衡是否出于清醒选择、是否可持续以及何时复查
    boundaries:
      - 阶段性失衡不能用来合理化持续伤害健康或关系的安排
      - 这是对段落与案例的归纳，不是作者给出的固定判定公式
    confidence: medium
    review_status: reviewing

  - id: turn-dashboard-signals-into-experiments
    title: 把仪表盘信号转成一个可复查的小实验
    statement: 选择一个需要关注的领域，设计低成本行动并在约定时间重新评估，而不是一次性规划完整人生。
    extraction_type: adapted
    source_refs:
      - source_id: designing-your-life-zh-cn-2017-epub
        chapter: 1
        section: 像设计师一样思考
        evidence_type: synthesis
        evidence_summary: 作者把人生设计描述为持续实验和原型迭代，并建议根据仪表盘识别需要改善之处和再次评估。
        locator:
          format: epub
          spine_index: 11
          doc_path: OEBPS/Text/chapter4-5.xhtml
          block_start: 2
          block_end: 7
    applications:
      - 选择一个红灯领域，定义一项一周内可执行的行动和复查日期
      - 复查后依据观察结果继续、调整或停止实验
    boundaries:
      - 一周和单一行动是本知识包的应用改写，不是原书规定的流程
      - 涉及严重健康、安全或法律问题时应寻求专业帮助
    confidence: medium
    review_status: reviewing
