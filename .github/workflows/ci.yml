name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install project
        run: python -m pip install .

      - name: Run unittest suite
        run: python -m unittest discover -s tests -v

      - name: Run Skill quick validation
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/openai/skills/main/skills/.system/skill-creator/scripts/quick_validate.py \
            --output "$RUNNER_TEMP/quick_validate.py"
          python "$RUNNER_TEMP/quick_validate.py" skills/extract-book-principles

      - name: Check sample package generation drift
        run: python -m book_principles render books/designing-your-life/zh-cn-2017-epub

      - name: Check repository diff
        run: |
          git diff --check
          git diff --exit-code
