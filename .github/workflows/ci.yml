name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Run unittest suite
        run: python -m unittest discover -s tests -v

      - name: Check sample package generation drift
        run: python -m book_principles validate books/designing-your-life/zh-cn-2017-epub --check-generated

      - name: Reject tracked private books
        shell: bash
        run: |
          tracked="$(git ls-files '*.epub' '*.mobi' '*.azw' '*.azw3')"
          if [[ -n "$tracked" ]]; then
            printf '%s\n' "$tracked"
            exit 1
          fi

      - name: Check repository diff
        run: |
          git diff --check
          git diff --exit-code
